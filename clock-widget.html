<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #FBEFEF;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    color: white;
    user-select: none;
  }

  /* Vagues décoratives en arrière-plan */
  .wave {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 70%);
    animation: drift 12s ease-in-out infinite;
    pointer-events: none;
  }
  .wave-1 { width: 600px; height: 600px; top: -200px; left: -200px; }
  .wave-2 { width: 500px; height: 500px; bottom: -150px; right: -150px; animation-delay: -4s; }
  .wave-3 { width: 400px; height: 400px; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -8s; }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.8; }
    50% { transform: translate(20px, -20px) scale(1.1); opacity: 1; }
  }
  .wave-3 {
    animation: drift-center 12s ease-in-out infinite;
  }
  @keyframes drift-center {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
    50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
  }

  /* Conteneur principal */
  .clock-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    z-index: 2;
    position: relative;
  }

  .cards {
    display: flex;
    gap: 16px;
  }

  .card {
    background: white;
    border-radius: 22px;
    padding: 18px 28px 16px;
    min-width: 150px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18), 0 0 0 1px rgba(255,255,255,0.4) inset;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 28px 70px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255,255,255,0.4) inset;
  }

  .card-hours {
    background: #FFCDC9;
  }
  .card-minutes {
    background: #FFCDC9;
  }

  .label-top {
    font-size: 14px;
    font-weight: 700;
    color: #1a1a1a;
    letter-spacing: 1.5px;
    margin-bottom: 4px;
    min-height: 18px;
  }

  .digits {
    font-family: 'Bebas Neue', 'Inter', sans-serif;
    font-size: 110px;
    font-weight: 400;
    color: #0a0a0a;
    line-height: 0.9;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0px;
    display: inline-block;
    transform-origin: center center;
  }

  .label-bottom {
    font-size: 12px;
    font-weight: 700;
    color: #666;
    letter-spacing: 2.5px;
    margin-top: 6px;
  }

  /* Animation flip subtile */
  .flip {
    animation: flipAnim 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes flipAnim {
    0%   { transform: rotateX(0deg); opacity: 1; }
    50%  { transform: rotateX(-90deg); opacity: 0.3; }
    100% { transform: rotateX(0deg); opacity: 1; }
  }

  /* Info en bas (date + salutation) */
  .info {
    text-align: center;
    color: #0a0a0a;
  }
  .greeting {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    opacity: 0.95;
    margin-bottom: 2px;
  }
  .date {
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.3px;
    opacity: 0.75;
    text-transform: capitalize;
  }

  /* Toggle 12h/24h */
  .toggle {
    position: absolute;
    top: 14px;
    right: 14px;
    background: rgba(255, 255, 255, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: white;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: all 0.2s ease;
    z-index: 10;
    font-family: inherit;
  }
  .toggle:hover {
    background: rgba(255, 255, 255, 0.28);
    transform: translateY(-1px);
  }
  .toggle:active { transform: translateY(0); }

  /* Toggle thème (dark/light) */
  .theme-toggle {
    position: absolute;
    top: 14px;
    left: 14px;
    background: rgba(255, 255, 255, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: black;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: all 0.2s ease;
    z-index: 10;
    font-size: 14px;
  }
  .theme-toggle:hover {
    background: rgba(255, 255, 255, 0.28);
    transform: translateY(-1px);
  }

  /* Mode sombre/cinematic */
  body.dark {
    background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 50%, #000000 100%);
  }
  body.dark .card {
    background: #1f1f2e;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.08) inset;
  }
  body.dark .label-top { color: #d4af37; }
  body.dark .digits { color: #ffffff; }
  body.dark .label-bottom { color: #888; }
  body.dark .wave {
    background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
  }

  /* Responsive : adapter aux petits embeds Notion */
  @media (max-width: 420px) {
    .digits { font-size: 60px; }
    .card { min-width: 120px; padding: 14px 20px; }
    .cards { gap: 12px; }
  }
  @media (max-height: 280px) {
    .digits { font-size: 56px; }
    .card { padding: 10px 22px; }
    .clock-wrapper { gap: 12px; }
    .info .date { display: none; }
  }
</style>
</head>
<body>
  <div class="wave wave-1"></div>
  <div class="wave wave-2"></div>
  <div class="wave wave-3"></div>

  <button class="theme-toggle" id="themeToggle" title="Changer de thème" aria-label="Changer de thème">🌙</button>
  <button class="toggle" id="formatToggle" title="Format 12h/24h">24H</button>

  <div class="clock-wrapper">
    <div class="cards">
      <div class="card card-hours">
        <div class="label-top">&nbsp;</div>
        <div class="digits" id="hours">06</div>
        <div class="label-bottom">HOUR</div>
      </div>
      <div class="card card-minutes">
        <div class="label-top">&nbsp;</div>
        <div class="digits" id="minutes">27</div>
        <div class="label-bottom">MINUTE</div>
      </div>
    </div>

    <div class="info">
      <div class="greeting" id="greeting">Bonjour</div>
      <div class="date" id="date">vendredi 22 mai 2026</div>
    </div>
  </div>

<script>
  // État
  let is24Hour = false;
  let isDarkMode = false;
  let prevHours = '';
  let prevMinutes = '';

  // Récupère la langue du navigateur (fr par défaut)
  const userLang = (navigator.language || 'fr-FR').startsWith('fr') ? 'fr-FR' : 'en-US';

  // Charge les préférences depuis localStorage si dispo
  try {
    if (localStorage.getItem('clockFormat') === '24') is24Hour = true;
    if (localStorage.getItem('clockTheme') === 'dark') {
      isDarkMode = true;
      document.body.classList.add('dark');
      document.getElementById('themeToggle').textContent = '☀️';
    }
  } catch (e) { /* localStorage indispo dans certains iframes Notion */ }

  function updateFormatButton() {
    document.getElementById('formatToggle').textContent = is24Hour ? '12H' : '24H';
  }
  updateFormatButton();

  function flipElement(el, newValue) {
    if (el.textContent === newValue) return;
    el.classList.remove('flip');
    void el.offsetWidth; // force reflow
    el.classList.add('flip');
    el.textContent = newValue;
  }

  function getGreeting(hour) {
    if (userLang === 'fr-FR') {
      if (hour < 6) return 'Bonne nuit';
      if (hour < 12) return 'Bonjour';
      if (hour < 18) return 'Bon après-midi';
      if (hour < 22) return 'Bonsoir';
      return 'Bonne nuit';
    } else {
      if (hour < 6) return 'Good night';
      if (hour < 12) return 'Good morning';
      if (hour < 18) return 'Good afternoon';
      if (hour < 22) return 'Good evening';
      return 'Good night';
    }
  }

  function updateClock() {
    const now = new Date();
    let h = now.getHours();
    const h24 = h;
    const m = now.getMinutes();
    const s = now.getSeconds();

    let period = '';
    if (!is24Hour) {
      period = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
    }

    const hStr = String(h).padStart(2, '0');
    const mStr = String(m).padStart(2, '0');

    flipElement(document.getElementById('hours'), hStr);
    flipElement(document.getElementById('minutes'), mStr);

    document.getElementById('period').textContent = is24Hour ? '24H' : period;

    // Salutation
    document.getElementById('greeting').textContent = getGreeting(h24);

    // Date formatée selon la langue
    const dateOptions = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
    document.getElementById('date').textContent = now.toLocaleDateString(userLang, dateOptions);
  }

  // Toggle format 12/24h
  document.getElementById('formatToggle').addEventListener('click', () => {
    is24Hour = !is24Hour;
    updateFormatButton();
    try { localStorage.setItem('clockFormat', is24Hour ? '24' : '12'); } catch (e) {}
    updateClock();
  });

  // Toggle thème dark/light
  document.getElementById('themeToggle').addEventListener('click', () => {
    isDarkMode = !isDarkMode;
    document.body.classList.toggle('dark', isDarkMode);
    document.getElementById('themeToggle').textContent = isDarkMode ? '☀️' : '🌙';
    try { localStorage.setItem('clockTheme', isDarkMode ? 'dark' : 'light'); } catch (e) {}
  });

  // Update toutes les secondes
  updateClock();
  setInterval(updateClock, 1000);
</script>
</body>
</html>
